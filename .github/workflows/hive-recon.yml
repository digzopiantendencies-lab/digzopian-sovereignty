name: Digzopian Hive Recon

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  swarm_recon:
    name: Hive Vortices Swarm Execution
    runs-on: self-hosted
    
    env:
      AZURE_SQL_CONN: ${{ secrets.AZURE_SQL_CONN }}
      NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Hive Repository
        uses: actions/checkout@v4
      
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
          
      - name: Execute Vortex A (Recon Scraper)
        run: |
          Write-Host "Initiating Vortex A: Scraping public CVEs and bounty scopes..."
          python scripts/vortex_scraper.py
          
      - name: Execute Vortex B (Pattern Analyst)
        run: |
          Write-Host "Initiating Vortex B: Applying Binarology logic to identify Go-ers..."
          python scripts/pattern_analyst.py

      - name: Deploy Vortex C (Bastion Sandbox)
        run: |
          Write-Host "Initiating Vortex C: Generating The Cure..."
          python scripts/sandbox_sim.py

      - name: Notify Discord Bridge
        if: always()
        continue-on-error: true
        run: |
          $status = "${{ job.status }}"
          if ($status -eq "success") {
            $msg = "[SWARM OK] Digzopian Hive Recon complete. All Vortex nodes executed successfully."
          } else {
            $msg = "[SWARM ALERT] Hive sequence encountered an issue. Check GitHub Actions logs."
          }
          $webhookUrl = "${{ secrets.DISCORD_WEBHOOK }}"
          $body = "{`"content`": `"$msg`"}"
          Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $body -ContentType "application/json"
          Write-Host "Discord notification sent."
