name: Digzopian Hive Recon

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  swarm_recon:
    name: Hive Vortices Swarm Execution
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Hive Repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Execute Vortex A (Recon Scraper)
        run: |
          Write-Host "Initiating Vortex A: Scraping public CVEs and bounty scopes..."
          python scripts/vortex_scraper.py

      - name: Execute Vortex B (Pattern Analyst)
        run: |
          Write-Host "Initiating Vortex B: Applying Binarology logic to identify Go-ers..."
          python scripts/pattern_analyst.py

      - name: Deploy Vortex C (Bastion Sandbox)
        run: |
          Write-Host "Initiating Vortex C: Generating The Cure..."
          python scripts/sandbox_sim.py

      - name: Notify Discord Bridge
        if: always()
        continue-on-error: true
        run: |
          $webhook = "${{ secrets.DISCORD_WEBHOOK }}"
          $status = "${{ job.status }}"
          $msg = if ($status -eq 'success') {
            "Sovereign Gate Operational - Daily Hive Recon complete. All Vortex nodes executed successfully."
          } else {
            "Hive Alert - Swarm sequence had an issue. Check GitHub Actions logs."
          }
          $payload = @{ content = $msg } | ConvertTo-Json
          Invoke-RestMethod -Uri $webhook -Method POST -Headers @{ 'Content-Type' = 'application/json' } -Body $payload
          Write-Host "Discord notified."
