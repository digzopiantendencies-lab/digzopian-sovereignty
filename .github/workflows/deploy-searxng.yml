name: Build and push SearXNG

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/searxng:latest

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/searxng:latest
      - name: Run container
        run: |
          docker rm -f searxng_ci_test 2>/dev/null || true
          docker run -d --name searxng_ci_test -p 8080:8080 ghcr.io/${{ github.repository_owner }}/searxng:latest
      - name: Wait for service (healthcheck)
        run: |
          echo "Waiting for service on http://localhost:8080/"
          START=$(date +%s)
          TIMEOUT=120
          while true; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              echo "Service responding"; break
            fi
            NOW=$(date +%s)
            ELAPSED=$((NOW-START))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Service did not become healthy after ${TIMEOUT}s"; exit 1
            fi
            sleep 3
          done
      - name: Cleanup
        if: always()
        run: |
          docker rm -f searxng_ci_test || true
